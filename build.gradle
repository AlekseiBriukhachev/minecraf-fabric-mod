plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.google.protobuf' version "${protobuf_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Protobuf
	implementation 'com.google.protobuf:protobuf-java:3.25.5'

	// Hibernate & JPA
	implementation 'org.hibernate.orm:hibernate-core:6.4.4.Final'
	implementation 'org.hibernate.orm:hibernate-hikaricp:6.4.4.Final'
	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

	// PostgreSQL Driver
	implementation 'org.postgresql:postgresql:42.7.7'

	// HikariCP connection pool
	implementation 'com.zaxxer:HikariCP:5.1.0'

	// Flyway for migration
	implementation 'org.flywaydb:flyway-core:10.4.1'
	implementation 'org.flywaydb:flyway-database-postgresql:10.4.1'
}

protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:3.25.5'
	}
}

sourceSets {
	main {
		proto {
			srcDir 'src/main/proto'
		}
		java {
			srcDirs += 'build/generated/source/proto/main/java'
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}

	exclude '**/*.proto'

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'

	// Отключаем annotation processing который вызывает ошибку
	it.options.compilerArgs.add('-proc:none')
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

tasks.named('compileJava') {
	dependsOn 'generateProto'
}

tasks.named('sourcesJar') {
	dependsOn 'generateProto'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}